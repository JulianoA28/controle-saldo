services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-balance_control}
      POSTGRES_USER: ${DB_USER:-balance_control}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-balance_control}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-balance_control}
      DB_USER: ${DB_USER:-balance_control}
      DB_PASSWORD: ${DB_PASSWORD:-balance_control}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend

  # One-shot legacy data load: waits for Flyway, COPYs ./data CSVs (or the zip), validates in SQL.
  dataload:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-balance_control}
      PGUSER: ${DB_USER:-balance_control}
      PGPASSWORD: ${DB_PASSWORD:-balance_control}
    volumes:
      - ./dataload/load.sh:/load.sh:ro
      - ./data:/data:ro
    entrypoint: ["/bin/sh", "/load.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
