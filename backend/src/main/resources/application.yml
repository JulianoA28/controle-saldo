spring:
  data:
    web:
      pageable:
        # Large pages on a 1M-row table are a self-inflicted outage.
        max-page-size: 100
        default-page-size: 20
  application:
    name: balance-control
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/balance_control}
    username: ${DB_USER:balance_control}
    password: ${DB_PASSWORD:balance_control}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    # Unknown routes go through ApiExceptionHandler (standard JSON) instead of Spring's default body.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
